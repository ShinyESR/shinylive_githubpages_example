name: Deploy Shinylive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: rocker/shiny:4.6.1
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update

      - name: Build Shinylive app
        run: Rscript -e "source('https://gist.githubusercontent.com/emaigne/d639efd66059755a1dea20c8f8ab7653/raw/30156b3cb85623152acee231d852faf352dde392/build_shinylive.R'); build_app(app_dir = '.')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4